name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Valida manifests e bots contra schema/, confere o SKILL.md com o manifest,
      # varre instruções suspeitas (falha em bloqueios, avisa em itens para revisão)
      # e confere que o index.json está atualizado.
      - name: Validar catálogo
        run: node scripts/build-index.mjs --check
      - name: Auto-testes da varredura
        run: node scripts/scan.test.mjs
